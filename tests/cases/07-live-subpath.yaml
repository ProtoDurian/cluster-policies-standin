# expect: fail reload-live-inputs
# live Pod mounting a ConfigMap file by subPath
apiVersion: v1
kind: Pod
metadata:
  name: ls
  labels:
    durian.cloud/landscape: lapras
    durian.cloud/platform: diene
    durian.cloud/service: demo
    durian.cloud/module: api
    durian.cloud/reload: live
spec:
  containers:
    - name: app
      image: busybox:1.36
      volumeMounts:
        - name: cfg
          mountPath: /etc/app/config.yaml
          subPath: config.yaml
  volumes:
    - name: cfg
      configMap:
        name: app-config

# expect: fail sos-key-owner-externalsecret
# nitroso asks for pichu's token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: steal-pichu
  namespace: nitroso
spec:
  refreshInterval: 10s
  secretStoreRef: { kind: ClusterSecretStore, name: infisical }
  target: { name: steal-pichu }
  data:
    - secretKey: token
      remoteRef: { key: "/pichu/access/token" }

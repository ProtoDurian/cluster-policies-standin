# expect: fail sos-key-owner-clusterexternalsecret
# nitroso's key copied into namespace pichu
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: sos-nitroso-into-pichu
spec:
  namespaceSelectors:
    - matchLabels: { kubernetes.io/metadata.name: pichu }
  refreshTime: 10s
  externalSecretName: sos-token
  externalSecretSpec:
    refreshInterval: 10s
    secretStoreRef: { kind: ClusterSecretStore, name: infisical }
    target: { name: platform-store-cred }
    data:
      - secretKey: token
        remoteRef: { key: "/nitroso/access/token" }

# expect: pass
# live Pod mounting a ConfigMap as a whole folder
apiVersion: v1
kind: Pod
metadata:
  name: lo
  labels:
    durian.cloud/landscape: lapras
    durian.cloud/platform: diene
    durian.cloud/service: demo
    durian.cloud/module: api
    durian.cloud/reload: live
spec:
  containers:
    - name: app
      image: busybox:1.36
      volumeMounts:
        - name: cfg
          mountPath: /etc/app
  volumes:
    - name: cfg
      configMap:
        name: app-config

# expect: fail reload-live-inputs
# live Pod reading a Secret key into env
apiVersion: v1
kind: Pod
metadata:
  name: lk
  labels:
    durian.cloud/landscape: lapras
    durian.cloud/platform: diene
    durian.cloud/service: demo
    durian.cloud/module: api
    durian.cloud/reload: live
spec:
  containers:
    - name: app
      image: busybox:1.36
      env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: token

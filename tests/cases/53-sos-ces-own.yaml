# expect: pass
# ClusterExternalSecret copies nitroso's token into nitroso
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: sos-nitroso
spec:
  namespaceSelectors:
    - matchLabels: { kubernetes.io/metadata.name: nitroso }
  refreshTime: 10s
  externalSecretName: sos-token
  externalSecretSpec:
    refreshInterval: 10s
    secretStoreRef: { kind: ClusterSecretStore, name: infisical }
    target: { name: platform-store-cred }
    data:
      - secretKey: token
        remoteRef: { key: "/nitroso/access/token" }

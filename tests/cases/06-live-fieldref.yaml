# expect: pass
# live Pod reading a fieldRef into env
apiVersion: v1
kind: Pod
metadata:
  name: lr
  labels:
    durian.cloud/landscape: lapras
    durian.cloud/platform: diene
    durian.cloud/service: demo
    durian.cloud/module: api
    durian.cloud/reload: live
spec:
  containers:
    - name: app
      image: busybox:1.36
      env:
        - name: NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

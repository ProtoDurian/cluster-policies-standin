# expect: fail reload-live-inputs
# live Pod whose init container takes a ConfigMap by envFrom
apiVersion: v1
kind: Pod
metadata:
  name: li
  labels:
    durian.cloud/landscape: lapras
    durian.cloud/platform: diene
    durian.cloud/service: demo
    durian.cloud/module: api
    durian.cloud/reload: live
spec:
  initContainers:
    - name: init
      image: busybox:1.36
      envFrom:
        - configMapRef:
            name: app-config
  containers:
    - name: app
      image: busybox:1.36

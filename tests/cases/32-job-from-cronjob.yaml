# expect: pass
# Job with labels on the object and pod template (what that CronJob makes)
apiVersion: batch/v1
kind: Job
metadata:
  name: cj-29000000
  labels:
    durian.cloud/landscape: lapras
    durian.cloud/platform: diene
    durian.cloud/service: demo
    durian.cloud/module: api
spec:
  template:
    metadata:
      labels:
        durian.cloud/landscape: lapras
        durian.cloud/platform: diene
        durian.cloud/service: demo
        durian.cloud/module: api
        durian.cloud/reload: restart
    spec:
      restartPolicy: Never
      containers:
        - name: app
          image: busybox:1.36

# Label key prefix. Template repos set it from their root chart's labelPrefix (scripts/local/helm-check.sh);
# the default lets this chart render on its own, in this repo's tests and CI.
labelPrefix: durian.cloud

# System namespaces the bindings leave out, so installing these policies never blocks system Pods.
exemptNamespaces: [kube-system, kube-public, kube-node-lease]

# The one named exception to the label rules: the Alloy operator's own objects, which its chart cannot label.
# Exact kind and name pairs; not a general opt-out.
alloyOperator:
  - kind: Deployment
    name: alloy-operator
  - kind: Job
    name: alloy-operator-crds

# Secrets guard (sos-key-owner-*): the one ClusterSecretStore per cluster that can read every platform's
# folder in the secret-of-secrets project, and the folder each platform may read through it. A platform
# (= its namespace name) may only read /<platform>/<folder>/<NAME>, with NAME matching namePattern.
sosStore:
  name: infisical
  folder: access
  # One key name below the folder: a regex without quotes, backslashes or slashes.
  namePattern: '[A-Za-z0-9_-]+'
